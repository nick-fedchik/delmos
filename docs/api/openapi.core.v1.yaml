openapi: 3.1.0
info:
  title: DELMOS Core First Slice API
  version: 0.1.0-draft
  description: >-
    Target contract for the first Core role and approval slice. Not implemented.
    Session establishment and external integrations are outside this fragment.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /programmes/{programme_id}/projects:
    post:
      operationId: createProject
      summary: Create a project and its initial PLAN-001 atomically
      x-required-permission: scopes.manage
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project, PLAN-001 and binding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/role-bindings:
    post:
      operationId: grantProjectRole
      summary: Grant a role in the project within the actor's delegation ceiling
      x-required-permission: access.grant
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRole'
      responses:
        '201':
          description: RoleBinding and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/role-bindings/{binding_id}:
    delete:
      operationId: revokeProjectRole
      summary: Revoke a project RoleBinding for subsequent requests
      x-required-permission: access.revoke
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BindingId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Binding revoked with a durable audit event
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products:
    post:
      operationId: createWorkProduct
      summary: Create a draft Work Product with its first immutable revision
      x-required-permission: wp.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkProduct'
      responses:
        '201':
          description: Draft created with server-generated revision and payload hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/revisions:
    post:
      operationId: reviseWorkProduct
      summary: Write a new immutable draft revision
      x-required-permission: wp.edit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseWorkProduct'
      responses:
        '201':
          description: New revision created without modifying the prior revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/specifications:
    post:
      operationId: createSpecification
      summary: Create a composite specification with an immutable composition manifest
      x-required-permission: wp.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpecification'
      responses:
        '201':
          description: Specification Work Product and first immutable revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/specifications/{specification_id}:
    get:
      operationId: getSpecification
      summary: Read an immutable composite specification manifest
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Specification and exact composition manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/specifications/{specification_id}/revisions:
    post:
      operationId: reviseSpecification
      summary: Write a new immutable specification revision and manifest
      x-required-permission: wp.edit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseSpecification'
      responses:
        '201':
          description: New immutable specification revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/submit:
    post:
      operationId: submitWorkProduct
      summary: Submit an exact revision for review
      x-required-permission: wp.submit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkProduct'
      responses:
        '200':
          description: ReviewRequest opened and Work Product moved to in_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/reviews:
    post:
      operationId: reviewWorkProduct
      summary: Record a positive review of the exact revision without approval
      x-required-permission: wp.review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '201':
          description: Independent review recorded; Work Product remains in_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecorded'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/request-changes:
    post:
      operationId: requestWorkProductChanges
      summary: Return an exact revision to draft with a reason
      x-required-permission: wp.request_changes
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChanges'
      responses:
        '200':
          description: Reason recorded and Work Product returned to draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/approvals:
    post:
      operationId: approveWorkProduct
      summary: Approve an exact revision following a positive review
      description: For a plan Work Product, this action requires plan.approve instead of wp.approve.
      x-required-permission: wp.approve or plan.approve for plan Work Products
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '201':
          description: Independent approval and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecorded'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/plan/apply:
    post:
      operationId: applyApprovedPlan
      summary: Apply a separately approved PLAN-001 revision
      x-required-permission: plan.apply
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '200':
          description: Effective plan revision and configuration generation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanApplied'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/revisions/{revision_id}:
    get:
      operationId: getWorkProductRevision
      summary: Read an exact authorized revision
      x-required-permission: wp.read and wp.history.read for noncurrent revision
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Exact revision with current authorization applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductRevision'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read sanitized audit events within the permitted scope
      x-required-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: subject_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sanitized audit events without raw payloads or secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/trace-links:
    post:
      operationId: createTraceLink
      summary: Create a typed traceability link between project work products
      x-required-permission: trace.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTraceLink'
      responses:
        '201':
          description: Traceability link created and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceLink'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
    get:
      operationId: listTraceLinks
      summary: List project traceability links (Change Impact review list, GRP-03)
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: suspect
          in: query
          required: false
          description: When "true", return only links flagged is_suspect after a source revision.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Traceability links, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TraceLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/trace-links/{trace_link_id}/acknowledge:
    post:
      operationId: acknowledgeTraceLink
      summary: Clear the is_suspect flag after reviewer confirmation (GRP-03)
      x-required-permission: trace.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: trace_link_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Suspect flag cleared or already clear (idempotent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/work-products/{work_product_id}/similar:
    get:
      operationId: findSimilarWorkProducts
      summary: Hybrid semantic search for near-duplicate requirements/tests (VEC-01..03)
      x-required-permission: wp.read
      description: >-
        Compares the work product's current revision embedding against other
        embedded revisions in the same project via pgvector cosine distance.
        Only vectors of the current embedding model are matched; permission
        scope is applied as a project_id SQL filter, not post-filtering.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: work_product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Similar work products ordered by descending cosine similarity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimilarWorkProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/traceability/{source_id}:
    get:
      operationId: traverseTraceability
      summary: Traverse the project traceability graph from a work product
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bounded recursive traceability path
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TracePathEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /system/automation/status:
    get:
      operationId: getAutomationStatus
      summary: Observe the automation engine outbox queue (ADR-007, SPEC-04)
      x-required-permission: system.observe
      description: >-
        Delivery counts by status and the dead-letter list for administrator
        monitoring (RUNBOOK.md, ADM-007). Not a project-scoped endpoint.
      responses:
        '200':
          description: Delivery status counts and dead-letter entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Automation engine not running }
  /projects/{project_id}/economics/earned-value:
    get:
      operationId: getEarnedValue
      summary: Earned value metrics of the project (ДСТУ ISO 21508, SWR-41)
      x-required-permission: economics.read
      description: >-
        Earned value management metrics per ISO 21508 (ADR-011). Planned value
        is time-phased linearly across the phase calendar; earned value uses the
        0/100 rule over approved deliverables linked to the phase (ISO 21511).
        Monetary values are decimal strings computed in PostgreSQL NUMERIC and
        are never converted to floating point. Ratio fields are null when the
        denominator is zero: absence of data must not be read as zero.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: as_of
          in: query
          required: false
          description: Control date (YYYY-MM-DD). Defaults to the current date.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Earned value snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarnedValueSnapshot'
        '400': { description: Malformed as_of parameter }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: No approved cost baseline for the project }
  /projects/{project_id}/phases/{phase_key}/transition:
    post:
      operationId: transitionPhase
      summary: Move a project phase through its lifecycle (SHR-13, ADR-006)
      x-required-permission: plan.apply
      description: >-
        Transitions a phase not_started -> active -> completed. Backward and
        skipping transitions are rejected: a completed phase is already
        reflected in earned value figures and reopening it would rewrite the
        totals the gate relied on. Economic facts (actual cost, funding limit,
        CPI) are computed inside the same transaction as the status change, so
        no expense can be recorded between the check and the write.
        rule.economics.funding_limit_gate vetoes closure when actual cost
        exceeds the funding limit; rule.economics.cost_variance_alert only
        records an audit warning.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phase_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_status]
              properties:
                target_status:
                  type: string
                  enum: [active, completed]
      responses:
        '200':
          description: Phase transitioned
          content:
            application/json:
              schema:
                type: object
                required: [phase_key, from_status, to_status]
                properties:
                  phase_key: { type: string }
                  from_status: { type: string }
                  to_status: { type: string }
        '400': { description: Malformed body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Phase not found in project }
        '422': { description: Invalid transition or blocked by a mandatory rule }
  /projects/{project_id}/work-products/{work_product_id}/submit:
    post:
      operationId: submitWorkProduct
      summary: Submit the latest revision for review (CORE-CONTRACT-001, ADR-009)
      x-required-permission: wp.submit
      description: >-
        Creates a ReviewRequest bound to the exact (revision_id, payload_hash)
        pair and moves the work product to in_review. Assignees are passed
        explicitly: a permission grants the ability to act, an assignment
        defines what it applies to (ADR-009 §1). The author of the revision may
        not be assigned as reviewer or approver. Committing a new revision
        supersedes the open request, because decisions are never carried over
        to a new hash (ADR-009 §3).
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: work_product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [user_id, assignment_role]
                    properties:
                      user_id: { type: string, format: uuid }
                      assignment_role:
                        type: string
                        enum: [reviewer, approver]
      responses:
        '201':
          description: Review request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequest'
        '400': { description: Malformed body or assignment role }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Work product not found }
        '409': { description: An open review request already exists }
        '422': { description: Not a draft, no revision, or assignee is the author }
  /projects/{project_id}/work-products/{work_product_id}/reviews:
    post:
      operationId: reviewWorkProduct
      summary: Record an independent review decision (ADR-009 §2)
      x-required-permission: wp.review
      description: >-
        Records an immutable review record. It deliberately does NOT move the
        work product to approved: a positive review is a precondition for
        approval, not approval itself. The decider must be assigned as reviewer
        on the open request and must not be the author of the revision.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/WorkProductId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '201': { description: Decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No permission, or not assigned as reviewer }
        '409': { description: Revision changed after the request was created }
        '422': { description: Not in review, or the decider is the author }
  /projects/{project_id}/work-products/{work_product_id}/approvals:
    post:
      operationId: approveWorkProduct
      summary: Record an approval decision (ADR-009 §2)
      x-required-permission: wp.approve
      description: >-
        Requires a prior positive review by a person independent of the author.
        The same person may both review and approve only when holding both
        separate permissions and both assignments. On success the request is
        closed and the work product becomes approved.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/WorkProductId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '201': { description: Decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No permission, or not assigned as approver }
        '409': { description: Revision changed after the request was created }
        '422': { description: No positive review yet, or the decider is the author }
  /projects/{project_id}/work-products/{work_product_id}/request-changes:
    post:
      operationId: requestChangesOnWorkProduct
      summary: Return the work product to draft with a reason (ADR-009 §3)
      x-required-permission: wp.request_changes
      description: >-
        Available to a reviewer or an approver. This is a "changes needed"
        conclusion, not a separate rejected state. A reason is mandatory.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/WorkProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DecisionInput'
                - required: [reason]
      responses:
        '201': { description: Decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDecision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No permission, or not assigned }
        '422': { description: Reason missing, or not in review }
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkProductId:
      name: work_product_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: delmos_session
      description: Server-side HttpOnly session; its creation is outside this fragment.
  parameters:
    ProgrammeId:
      in: path
      name: programme_id
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: { type: string, format: uuid }
    BindingId:
      in: path
      name: binding_id
      required: true
      schema: { type: string, format: uuid }
    WorkProductId:
      in: path
      name: work_product_id
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      in: path
      name: revision_id
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Missing permission for a visible action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Hidden:
      description: Resource is missing or not visible in this scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Stale row version or idempotency key reused with different payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Invariant:
      description: Validation, SoD, quorum or lifecycle rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateProject:
      type: object
      additionalProperties: false
      required: [name, repository_provider]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        repository_provider: { const: internal }
    ProjectCreated:
      type: object
      required: [project_id, plan_work_product_id, plan_revision_id, plan_payload_hash, row_version]
      properties:
        project_id: { type: string, format: uuid }
        plan_work_product_id: { type: string, format: uuid }
        plan_revision_id: { type: string, format: uuid }
        plan_payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        row_version: { type: integer, minimum: 1 }
    GrantRole:
      type: object
      additionalProperties: false
      required: [user_id, role_key, reason]
      properties:
        user_id: { type: string, format: uuid }
        role_key:
          type: string
          enum: [viewer, engineer, reviewer, approver, auditor, project_manager]
        reason: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    RoleBinding:
      type: object
      required: [id, user_id, role_key, project_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_key: { type: string }
        project_id: { type: string, format: uuid }
    CreateWorkProduct:
      type: object
      additionalProperties: false
      required: [code, type, title, body]
      properties:
        code: { type: string, minLength: 1 }
        type: { const: requirement }
        title: { type: string, minLength: 1 }
        body: { type: string }
        metadata: { type: object }
    CreateSpecification:
      type: object
      additionalProperties: false
      required: [code, title, body, manifest]
      properties:
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string }
        metadata: { type: object }
        manifest:
          $ref: '#/components/schemas/CompositionManifest'
    ReviseSpecification:
      type: object
      additionalProperties: false
      required: [expected_row_version, body, manifest]
      properties:
        expected_row_version: { type: integer, minimum: 1 }
        body: { type: string }
        metadata: { type: object }
        manifest:
          $ref: '#/components/schemas/CompositionManifest'
    CompositionManifest:
      type: object
      additionalProperties: false
      required: [manifest_version, sections, occurrences, elements_hash]
      properties:
        manifest_version: { const: '1.0.0' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/CompositionSection' }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/CompositionOccurrence' }
        elements_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CompositionSection:
      type: object
      additionalProperties: false
      required: [section_id, title, order]
      properties:
        section_id: { type: string, minLength: 1 }
        parent_section_id: { type: [string, 'null'] }
        title: { type: string, minLength: 1 }
        narrative: { type: string }
        order: { type: integer, minimum: 1 }
    CompositionOccurrence:
      type: object
      additionalProperties: false
      required: [occurrence_id, section_id, target_wp_id, target_revision_id, target_payload_hash, order]
      properties:
        occurrence_id: { type: string, format: uuid }
        section_id: { type: string, minLength: 1 }
        target_wp_id: { type: string, format: uuid }
        target_revision_id: { type: string, format: uuid }
        target_payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        order: { type: integer, minimum: 1 }
    CreateTraceLink:
      type: object
      additionalProperties: false
      required: [source_id, target_id, relation_kind]
      properties:
        source_id: { type: string, format: uuid }
        source_revision_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_revision_id: { type: string, format: uuid }
        relation_kind: { type: string, enum: [verifies, satisfies, refines, derives_from] }
    TraceLink:
      type: object
      required: [id, source_id, target_id, relation_kind, is_suspect]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        source_revision_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_revision_id: { type: string, format: uuid }
        relation_kind: { type: string, enum: [verifies, satisfies, refines, derives_from] }
        is_suspect: { type: boolean }
    TracePathEntry:
      type: object
      required: [depth, source_id, source_code, target_id, target_code, target_type, relation_kind, is_suspect, is_cycle]
      properties:
        depth: { type: integer, minimum: 1 }
        source_id: { type: string, format: uuid }
        source_code: { type: string }
        target_id: { type: string, format: uuid }
        target_code: { type: string }
        target_type: { type: string }
        source_revision_id: { type: string, format: uuid }
        target_revision_id: { type: string, format: uuid }
        relation_kind: { type: string, enum: [verifies, satisfies, refines, derives_from] }
        is_suspect: { type: boolean }
        is_cycle: { type: boolean }
    SimilarWorkProduct:
      type: object
      required: [work_product_id, code, title, status, cosine_similarity]
      properties:
        work_product_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        status: { type: string }
        cosine_similarity: { type: number, format: double, minimum: -1, maximum: 1 }
    DeadLetterEntry:
      type: object
      required: [delivery_id, event_key, trigger_key, delivery_attempts, last_error, created_at]
      properties:
        delivery_id: { type: string, format: uuid }
        event_key: { type: string }
        trigger_key: { type: string }
        delivery_attempts: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    DecisionInput:
      type: object
      properties:
        reason:
          type: string
          description: Mandatory for request-changes; ignored otherwise.
        operation_key:
          type: string
          description: >-
            Idempotency key. Repeating a call with the same key returns the
            previous decision instead of adding a second signature to the quorum.
    ReviewDecision:
      type: object
      required: [id, review_request_id, revision_id, decision_kind, outcome, decided_by, decided_at, work_product_status]
      properties:
        id: { type: string, format: uuid }
        review_request_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        decision_kind: { type: string, enum: [review, approval, request_changes] }
        outcome: { type: string, enum: [positive, changes_requested] }
        decided_by: { type: string, format: uuid }
        reason: { type: string }
        decided_at: { type: string, format: date-time }
        work_product_status:
          type: string
          description: Status after the decision. A positive review leaves it in_review.
    ReviewRequest:
      type: object
      required: [id, project_id, work_product_id, revision_id, status, requested_by, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        work_product_id: { type: string, format: uuid }
        revision_id:
          type: string
          format: uuid
          description: The exact revision under review. Never reassigned to a newer one.
        status:
          type: string
          enum: [open, approved, changes_requested, superseded]
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    EarnedValueSnapshot:
      type: object
      description: >-
        Earned value metrics per ДСТУ ISO 21508:2022. Monetary fields are
        decimal strings, not numbers, so that NUMERIC precision survives JSON
        transport intact.
      required: [project_id, as_of, currency, bac, pv, ac, ev, cv, sv, phases]
      properties:
        project_id: { type: string, format: uuid }
        as_of: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3 }
        baseline_id: { type: string, format: uuid }
        baseline_version: { type: integer }
        bac: { type: string, description: Budget at completion }
        pv: { type: string, description: Planned value (BCWS) }
        ac: { type: string, description: Actual cost (ACWP) }
        ev: { type: string, description: Earned value (BCWP) }
        cv: { type: string, description: Cost variance, EV minus AC }
        sv: { type: string, description: Schedule variance, EV minus PV }
        cpi:
          type: [string, 'null']
          description: EV divided by AC. Null when AC is zero (no data, not zero).
        spi:
          type: [string, 'null']
          description: EV divided by PV. Null when PV is zero.
        eac:
          type: [string, 'null']
          description: BAC divided by CPI. Null when nothing has been earned yet.
        phases:
          type: array
          items: { $ref: '#/components/schemas/PhaseEarnedValue' }
    PhaseEarnedValue:
      type: object
      required: [phase_key, name, status, planned_total, funding_limit, pv, ac, ev, over_limit]
      properties:
        phase_key: { type: string }
        name: { type: string }
        status: { type: string, enum: [not_started, active, completed] }
        planned_total: { type: string }
        funding_limit: { type: string }
        pv: { type: string }
        ac: { type: string }
        ev: { type: string }
        over_limit:
          type: boolean
          description: >-
            Actual cost exceeded the funding limit. Input for
            rule.economics.funding_limit_gate (SHR-13).
    AutomationStatus:
      type: object
      required: [counts, dead_letters]
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }
          description: Delivery counts keyed by status (pending, leased, delivered, failed, dead_letter).
        dead_letters:
          type: array
          items: { $ref: '#/components/schemas/DeadLetterEntry' }
    SpecificationView:
      type: object
      required: [specification_id, work_product, manifest]
      properties:
        specification_id: { type: string, format: uuid }
        work_product:
          type: object
          additionalProperties: true
        manifest:
          $ref: '#/components/schemas/CompositionManifest'
    ReviseWorkProduct:
      type: object
      additionalProperties: false
      required: [expected_row_version, title, body]
      properties:
        expected_row_version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string }
        metadata: { type: object }
    RevisionAction:
      type: object
      additionalProperties: false
      required: [revision_id, payload_hash, expected_row_version]
      properties:
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expected_row_version: { type: integer, minimum: 1 }
    SubmitWorkProduct:
      type: object
      additionalProperties: false
      required: [revision_id, payload_hash, expected_row_version, reviewer_id, approver_id]
      properties:
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expected_row_version: { type: integer, minimum: 1 }
        reviewer_id: { type: string, format: uuid }
        approver_id: { type: string, format: uuid }
    RequestChanges:
      type: object
      additionalProperties: false
      required: [revision_id, payload_hash, expected_row_version, reason]
      properties:
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expected_row_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    WorkProductState:
      type: object
      required: [work_product_id, revision_id, payload_hash, row_version, status]
      properties:
        work_product_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        row_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, in_review, approved, obsolete] }
    WorkProductRevision:
      type: object
      required: [work_product_id, revision_id, payload_hash, title, body, is_current_revision, current_work_product_status]
      properties:
        work_product_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        title: { type: string }
        body: { type: string }
        is_current_revision: { type: boolean }
        current_work_product_status: { type: string, enum: [draft, in_review, approved, obsolete] }
    DecisionRecorded:
      type: object
      required: [decision_id, revision_id, payload_hash, status]
      properties:
        decision_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [in_review, approved] }
    PlanApplied:
      type: object
      required: [effective_plan_revision_id, config_generation, row_version]
      properties:
        effective_plan_revision_id: { type: string, format: uuid }
        config_generation: { type: integer, minimum: 1 }
        row_version: { type: integer, minimum: 1 }
    AuditEvent:
      type: object
      required: [id, actor_ref, role_key, action_key, decision, scope_type, subject_type, occurred_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        actor_ref: { type: string, format: uuid }
        role_key: { type: string }
        scope_type: { type: string }
        scope_id: { type: string, format: uuid }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        action_key: { type: string }
        decision: { type: string }
        revision_id: { type: string, format: uuid }
        payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        correlation_id: { type: string }
        occurred_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }