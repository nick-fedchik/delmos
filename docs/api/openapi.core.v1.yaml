openapi: 3.1.0
info:
  title: DELMOS Core First Slice API
  version: 0.1.0-draft
  description: >-
    Target contract for the first Core role and approval slice. Not implemented.
    Session establishment and external integrations are outside this fragment.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /programmes/{programme_id}/projects:
    post:
      operationId: createProject
      summary: Create a project and its initial PLAN-001 atomically
      x-required-permission: scopes.manage
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project, PLAN-001 and binding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/role-bindings:
    post:
      operationId: grantProjectRole
      summary: Grant a role in the project within the actor's delegation ceiling
      x-required-permission: access.grant
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRole'
      responses:
        '201':
          description: RoleBinding and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/role-bindings/{binding_id}:
    delete:
      operationId: revokeProjectRole
      summary: Revoke a project RoleBinding for subsequent requests
      x-required-permission: access.revoke
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BindingId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Binding revoked with a durable audit event
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products:
    post:
      operationId: createWorkProduct
      summary: Create a draft Work Product with its first immutable revision
      x-required-permission: wp.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkProduct'
      responses:
        '201':
          description: Draft created with server-generated revision and payload hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/revisions:
    post:
      operationId: reviseWorkProduct
      summary: Write a new immutable draft revision
      x-required-permission: wp.edit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseWorkProduct'
      responses:
        '201':
          description: New revision created without modifying the prior revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/specifications:
    post:
      operationId: createSpecification
      summary: Create a composite specification with an immutable composition manifest
      x-required-permission: wp.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpecification'
      responses:
        '201':
          description: Specification Work Product and first immutable revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/specifications/{specification_id}:
    get:
      operationId: getSpecification
      summary: Read an immutable composite specification manifest
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Specification and exact composition manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/specifications/{specification_id}/revisions:
    post:
      operationId: reviseSpecification
      summary: Write a new immutable specification revision and manifest
      x-required-permission: wp.edit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseSpecification'
      responses:
        '201':
          description: New immutable specification revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/submit:
    post:
      operationId: submitWorkProduct
      summary: Submit an exact revision for review
      x-required-permission: wp.submit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkProduct'
      responses:
        '200':
          description: ReviewRequest opened and Work Product moved to in_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/reviews:
    post:
      operationId: reviewWorkProduct
      summary: Record a positive review of the exact revision without approval
      x-required-permission: wp.review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '201':
          description: Independent review recorded; Work Product remains in_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecorded'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/request-changes:
    post:
      operationId: requestWorkProductChanges
      summary: Return an exact revision to draft with a reason
      x-required-permission: wp.request_changes
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChanges'
      responses:
        '200':
          description: Reason recorded and Work Product returned to draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/approvals:
    post:
      operationId: approveWorkProduct
      summary: Approve an exact revision following a positive review
      description: For a plan Work Product, this action requires plan.approve instead of wp.approve.
      x-required-permission: wp.approve or plan.approve for plan Work Products
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '201':
          description: Independent approval and audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecorded'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/plan/apply:
    post:
      operationId: applyApprovedPlan
      summary: Apply a separately approved PLAN-001 revision
      x-required-permission: plan.apply
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionAction'
      responses:
        '200':
          description: Effective plan revision and configuration generation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanApplied'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
  /projects/{project_id}/work-products/{work_product_id}/revisions/{revision_id}:
    get:
      operationId: getWorkProductRevision
      summary: Read an exact authorized revision
      x-required-permission: wp.read and wp.history.read for noncurrent revision
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/WorkProductId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Exact revision with current authorization applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkProductRevision'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/audit-events:
    get:
      operationId: listAuditEvents
      summary: Read sanitized audit events within the permitted scope
      x-required-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: subject_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sanitized audit events without raw payloads or secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/trace-links:
    post:
      operationId: createTraceLink
      summary: Create a typed traceability link between project work products
      x-required-permission: trace.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTraceLink'
      responses:
        '201':
          description: Traceability link created and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceLink'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invariant' }
    get:
      operationId: listTraceLinks
      summary: List project traceability links (Change Impact review list, GRP-03)
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: suspect
          in: query
          required: false
          description: When "true", return only links flagged is_suspect after a source revision.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Traceability links, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TraceLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/trace-links/{trace_link_id}/acknowledge:
    post:
      operationId: acknowledgeTraceLink
      summary: Clear the is_suspect flag after reviewer confirmation (GRP-03)
      x-required-permission: trace.create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: trace_link_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Suspect flag cleared or already clear (idempotent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/work-products/{work_product_id}/similar:
    get:
      operationId: findSimilarWorkProducts
      summary: Hybrid semantic search for near-duplicate requirements/tests (VEC-01..03)
      x-required-permission: wp.read
      description: >-
        Compares the work product's current revision embedding against other
        embedded revisions in the same project via pgvector cosine distance.
        Only vectors of the current embedding model are matched; permission
        scope is applied as a project_id SQL filter, not post-filtering.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: work_product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Similar work products ordered by descending cosine similarity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimilarWorkProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /projects/{project_id}/traceability/{source_id}:
    get:
      operationId: traverseTraceability
      summary: Traverse the project traceability graph from a work product
      x-required-permission: wp.read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bounded recursive traceability path
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TracePathEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Hidden' }
  /system/automation/status:
    get:
      operationId: getAutomationStatus
      summary: Observe the automation engine outbox queue (ADR-007, SPEC-04)
      x-required-permission: system.observe
      description: >-
        Delivery counts by status and the dead-letter list for administrator
        monitoring (RUNBOOK.md, ADM-007). Not a project-scoped endpoint.
      responses:
        '200':
          description: Delivery status counts and dead-letter entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Automation engine not running }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: delmos_session
      description: Server-side HttpOnly session; its creation is outside this fragment.
  parameters:
    ProgrammeId:
      in: path
      name: programme_id
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: project_id
      required: true
      schema: { type: string, format: uuid }
    BindingId:
      in: path
      name: binding_id
      required: true
      schema: { type: string, format: uuid }
    WorkProductId:
      in: path
      name: work_product_id
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      in: path
      name: revision_id
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Missing permission for a visible action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Hidden:
      description: Resource is missing or not visible in this scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Stale row version or idempotency key reused with different payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Invariant:
      description: Validation, SoD, quorum or lifecycle rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateProject:
      type: object
      additionalProperties: false
      required: [name, repository_provider]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        repository_provider: { const: internal }
    ProjectCreated:
      type: object
      required: [project_id, plan_work_product_id, plan_revision_id, plan_payload_hash, row_version]
      properties:
        project_id: { type: string, format: uuid }
        plan_work_product_id: { type: string, format: uuid }
        plan_revision_id: { type: string, format: uuid }
        plan_payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        row_version: { type: integer, minimum: 1 }
    GrantRole:
      type: object
      additionalProperties: false
      required: [user_id, role_key, reason]
      properties:
        user_id: { type: string, format: uuid }
        role_key:
          type: string
          enum: [viewer, engineer, reviewer, approver, auditor, project_manager]
        reason: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
    RoleBinding:
      type: object
      required: [id, user_id, role_key, project_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_key: { type: string }
        project_id: { type: string, format: uuid }
    CreateWorkProduct:
      type: object
      additionalProperties: false
      required: [code, type, title, body]
      properties:
        code: { type: string, minLength: 1 }
        type: { const: requirement }
        title: { type: string, minLength: 1 }
        body: { type: string }
        metadata: { type: object }
    CreateSpecification:
      type: object
      additionalProperties: false
      required: [code, title, body, manifest]
      properties:
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        body: { type: string }
        metadata: { type: object }
        manifest:
          $ref: '#/components/schemas/CompositionManifest'
    ReviseSpecification:
      type: object
      additionalProperties: false
      required: [expected_row_version, body, manifest]
      properties:
        expected_row_version: { type: integer, minimum: 1 }
        body: { type: string }
        metadata: { type: object }
        manifest:
          $ref: '#/components/schemas/CompositionManifest'
    CompositionManifest:
      type: object
      additionalProperties: false
      required: [manifest_version, sections, occurrences, elements_hash]
      properties:
        manifest_version: { const: '1.0.0' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/CompositionSection' }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/CompositionOccurrence' }
        elements_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    CompositionSection:
      type: object
      additionalProperties: false
      required: [section_id, title, order]
      properties:
        section_id: { type: string, minLength: 1 }
        parent_section_id: { type: [string, 'null'] }
        title: { type: string, minLength: 1 }
        narrative: { type: string }
        order: { type: integer, minimum: 1 }
    CompositionOccurrence:
      type: object
      additionalProperties: false
      required: [occurrence_id, section_id, target_wp_id, target_revision_id, target_payload_hash, order]
      properties:
        occurrence_id: { type: string, format: uuid }
        section_id: { type: string, minLength: 1 }
        target_wp_id: { type: string, format: uuid }
